services:
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=jobscraper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobscraper"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  migrator:
    container_name: migrator
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
      target: dev
    env_file:
      - .env.dev
    volumes:
      - ../backend:/app/backend
    command: alembic -c backend/alembic.ini upgrade head
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:

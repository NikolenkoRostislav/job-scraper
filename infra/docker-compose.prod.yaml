services:
  api:
    container_name: job-scraper-api
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
      target: prod
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    expose:
      - 8000
    env_file:
      - .env.prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "
          import urllib.request, json, sys;
          resp = json.load(urllib.request.urlopen('http://localhost:8000/api/health'));
          if not resp.get('api_healthy') or not resp.get('db_healthy') or not resp.get('redis_healthy'):
            sys.exit(1)
          "]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  nginx:
    container_name: job-scraper-nginx
    build:
      context: ..
      dockerfile: infra/Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    external: true
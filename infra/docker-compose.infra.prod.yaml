services:
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - app-network
    expose:
      - 6379
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=jobscraper
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobscraper"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  migrator:
    container_name: migrator
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
      target: prod
    env_file:
      - .env.prod
    command: alembic -c backend/alembic.ini upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

volumes:
  redis-data:
  postgres-data:

networks:
  app-network:
    external: true
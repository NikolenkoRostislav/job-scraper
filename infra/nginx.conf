events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

    server {
        listen 80;
        server_name placeholder.com; #I dont have a domain name yet :(
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name placeholder.com;

        ssl_certificate /etc/letsencrypt/live/placeholder.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/placeholder.com/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/jobs {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_cache api_cache;
            proxy_cache_valid 200 60m;
            proxy_cache_key "$request_method$request_uri";
            proxy_pass http://api:8000/jobs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/skills {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_cache api_cache;
            proxy_cache_valid 200 60m;
            proxy_cache_key "$request_method$request_uri";
            proxy_pass http://api:8000/skills;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
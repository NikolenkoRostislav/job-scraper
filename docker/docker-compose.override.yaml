services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: job-scraper-frontend
    volumes:
      - ../frontend:/app 
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000 
    command: npm run dev -- --host

  api:
    build:
      target: dev 
    command: uvicorn api.main:app --reload --host 0.0.0.0 --port 8000
    env_file:
      - .env.docker
    environment:
      - DATABASE__DB_PASSWORD=password
      - DATABASE__DB_HOST=postgres
    volumes:
      - ../backend:/app/backend
    depends_on:
      migrator:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=jobscraper
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobscraper"]
      interval: 5s
      timeout: 10s
      retries: 5

  migrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: dev
    container_name: migrator
    command: alembic -c backend/alembic.ini upgrade head 
    env_file:
      - .env.docker
    environment:
      - DATABASE__DB_PASSWORD=password
      - DATABASE__DB_HOST=postgres
    volumes:
      - ../backend:/app/backend
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  frontend_node_modules:

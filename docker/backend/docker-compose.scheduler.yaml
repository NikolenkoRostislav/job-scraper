services:
  celery_worker:
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile
      target: prod
    container_name: job-scraper-worker
    command: celery -A backend.scheduler.app.celery worker --loglevel=info
    depends_on:
      - redis
    env_file:
      - .env.docker

  celery_beat:
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile
      target: prod
    container_name: job-scraper-beat
    command: celery -A backend.scheduler.app.celery beat --loglevel=info
    depends_on:
      - redis
    env_file:
      - .env.docker

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:

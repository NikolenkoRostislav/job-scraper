services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    container_name: job-scraper-api
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - .env.docker 

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
